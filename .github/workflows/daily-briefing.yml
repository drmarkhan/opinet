name: Daily Opinet briefing

on:
  schedule:
    # 07:30 ChatGPT 알림 전에 결과가 준비되도록 07:10 KST에 실행.
    - cron: "10 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-opinet-briefing
  cancel-in-progress: false

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 저장소 받기
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 가격 브리핑 실행
        id: briefing
        continue-on-error: true
        env:
          OPINET_API_KEY: ${{ secrets.OPINET_API_KEY }}
        run: |
          set +e
          python -m opinet_briefing.main
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: 결과와 오류 상태 저장
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "저장할 변경이 없습니다."
          else
            git commit -m "data: save daily Opinet snapshot"
            git push
          fi

      - name: 지도 결과 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opinet-map-${{ github.run_id }}
          path: reports/*.html
          if-no-files-found: ignore
          retention-days: 30

      - name: 실행 실패 표시
        if: steps.briefing.outputs.exit_code != '0'
        run: exit 1
